name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholders only — nothing in `next build`/`vitest run` opens a real
      # connection (db/client.ts connects lazily; no route is statically
      # generated against the database). Real secrets live in Vercel, not here.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci_placeholder
      EMAIL_FROM: onboarding@resend.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
